<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Open To Work</title>
<meta name="description" content="Download Open To Work for iPhone or Android.">
<meta name="robots" content="noindex">
<meta name="apple-itunes-app" content="app-id=6762345007">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<script>
  // One link for both stores (used by the QR code in the web app).
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) location.replace('https://apps.apple.com/app/id6762345007');
    else if (/Android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.cvmakerpro.cvmakerpro02');
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #F7F6F2; color: #16201D; }
  h1 { font-size: 28px; margin: 16px 0 8px; }
  p { color: #4E5A56; margin: 0 0 24px; }
  .badges { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .badges img { height: 48px; width: auto; display: block; }
  a.back { display: inline-block; margin-top: 24px; color: #0E5E4F; }
  @media (prefers-color-scheme: dark) { body { background: #0E1412; color: #F2F1EC; } p { color: #B4BCB8; } a.back { color: #5CC6A8; } }
</style>
</head>
<body>
<main>
  <img src="../apple-touch-icon.png" width="72" height="72" alt="" style="border-radius:16px">
  <h1>Open To Work</h1>

  <div class="badges">
    <a href="https://apps.apple.com/app/id6762345007"><img src="../badges/appstore-en.svg" alt="Download on the App Store"></a>
    <a href="https://play.google.com/store/apps/details?id=com.cvmakerpro.cvmakerpro02"><img src="../badges/play-en.png" alt="Get it on Google Play"></a>
  </div>
  <a class="back" href="../">emrekaramustafa.github.io/cv-maker-pro-legal</a>
</main>
</body>
</html>
